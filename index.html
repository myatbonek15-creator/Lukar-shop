<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐊𝐞𝐯𝐢𝐧 𝐏𝐫𝐞𝐦𝐢𝐮𝐦 𝐆𝐚𝐦𝐞 𝐒𝐭𝐨𝐫𝐞</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+Myanmar:wght@300;400;700&display=swap');
        
        :root { --primary: #00d2ff; --secondary: #ffcc00; --bg-dark: #02040a; }

        body { font-family: 'Noto Sans Myanmar', sans-serif; background-color: var(--bg-dark); color: #e2e8f0; margin: 0; overflow-x: hidden; }
        .game-font { font-family: 'Orbitron', sans-serif; }
        .mm-bold { font-weight: 700; }

        .screen { display: none; min-height: 100vh; }
        .screen.active { display: flex; flex-direction: column; }

        #preloader { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: 0.8s; }
        
        .swiper { width: 100%; height: 100%; }
        .premium-card { background: linear-gradient(145deg, #0f172a 0%, #020617 100%); border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.4s; }
        .premium-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .btn-gold {
            background: linear-gradient(90deg, #b38728 0%, #fbf5b7 50%, #bf953f 100%);
            color: #000; font-weight: 800; transition: 0.3s;
        }

        .status-badge { padding: 2px 10px; border-radius: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; z-index: 10; }
        .available { background: rgba(16, 185, 129, 0.8); color: #fff; }
        .sold { background: rgba(239, 68, 68, 0.8); color: #fff; }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="game-font text-4xl font-black text-white tracking-[10px] animate-pulse">KEVIN</div>
    </div>

    <div id="screen-welcome" class="screen active items-center justify-center text-center px-6 relative overflow-hidden">
        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070" class="absolute inset-0 w-full h-full object-cover grayscale-[50%] opacity-40 scale-110">
        <div class="relative z-10">
            <h1 class="game-font text-8xl md:text-[10rem] font-black text-white italic tracking-tighter drop-shadow-2xl">𝐊𝐄𝐕𝐈𝐍</h1>
            <p id="welcome-text" class="mb-10 text-blue-200 text-xl mm-bold min-h-[3rem]"></p>
            <button onclick="switchScreen('screen-list')" class="btn-gold px-14 py-5 rounded-sm mm-bold uppercase tracking-widest text-lg">ဝင်မည်</button>
        </div>
    </div>

    <div id="screen-list" class="screen bg-[#02040a]">
        <nav class="bg-black/90 backdrop-blur-md border-b border-white/5 flex justify-between items-center p-5 sticky top-0 z-50">
            <button onclick="switchScreen('screen-welcome')" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-house"></i></button>
            <div class="game-font text-2xl font-black">𝐊𝐄𝐕𝐈𝐍 <span class="text-primary italic">STORE</span></div>
            <div class="w-8"></div>
        </nav>

        <div class="container mx-auto px-5 py-10">
            <h2 class="text-2xl font-bold text-white mb-8 mm-bold border-l-4 border-primary pl-4">ရောင်းရန်ရှိသော အကောင့်များ</h2>
            <div id="account-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </div>

    <div id="screen-detail" class="screen bg-[#02040a]">
        <nav class="bg-black/80 border-b border-white/5 flex justify-between items-center p-5 sticky top-0 z-50">
            <button onclick="switchScreen('screen-list')" class="text-gray-400 mm-bold"><i class="fa-solid fa-arrow-left"></i> နောက်သို့</button>
        </nav>
        <div id="detail-content" class="container mx-auto px-5 py-10 max-w-6xl"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCo1yi0zDkr52K89G6UHPtIbHdaicWaurc",
            authDomain: "kevingameshop-cb79c.firebaseapp.com",
            databaseURL: "https://kevingameshop-cb79c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kevingameshop-cb79c",
            storageBucket: "kevingameshop-cb79c.firebasestorage.app",
            messagingSenderId: "1073950822440",
            appId: "1:1073950822440:web:55f407a2cb4efc63e6251d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Preloader & Typewriter
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').style.opacity = '0';
                setTimeout(() => { document.getElementById('preloader').style.display = 'none'; startWelcomeText(); }, 800);
            }, 2000);
        });

        function startWelcomeText() {
            const text = "စိတ်ချရသော MLBB အကောင့်များ စုစည်းမှု";
            let i = 0;
            const element = document.getElementById('welcome-text');
            function type() { if (i < text.length) { element.innerHTML += text.charAt(i); i++; setTimeout(type, 50); } }
            type();
        }

        window.switchScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        };

        // Real-time Data Listen Only (No Write Function)
        onValue(ref(db, 'accounts'), (snapshot) => {
            const data = snapshot.val();
            const grid = document.getElementById('account-grid');
            if (!data) { grid.innerHTML = `<p class="col-span-full text-center py-20 text-gray-500">အကောင့်များ မရှိသေးပါ။</p>`; return; }
            
            const list = Object.entries(data).map(([key, value]) => ({...value, dbKey: key}));
            grid.innerHTML = list.map(acc => {
                const imgArray = Array.isArray(acc.images) ? acc.images : (acc.images ? acc.images.split(',') : []);
                
                return `
                <div class="premium-card rounded-3xl overflow-hidden shadow-xl">
                    <div class="relative h-72">
                        <div class="absolute top-4 left-4 status-badge ${acc.sold ? 'sold' : 'available'}">${acc.sold ? 'Sold' : acc.rank}</div>
                        <div class="swiper mySwiper-${acc.id.replace(/\s+/g, '')}">
                            <div class="swiper-wrapper">
                                ${imgArray.map(img => `<div class="swiper-slide"><img src="${img.trim()}" class="w-full h-full object-cover"></div>`).join('')}
                            </div>
                            <div class="swiper-pagination"></div>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-center mb-4">
                            <span class="game-font text-gray-400 text-xs">${acc.id}</span>
                            <span class="text-secondary font-black text-xl">${acc.price} Ks</span>
                        </div>
                        <button onclick='showAccountDetail(${JSON.stringify({...acc, images: imgArray})})' class="w-full bg-blue-600/20 border border-blue-500/30 text-primary py-3 rounded-xl font-bold hover:bg-blue-600 hover:text-white transition uppercase text-xs tracking-widest">အသေးစိတ်ကြည့်မည်</button>
                    </div>
                </div>
                `;
            }).join('');

            list.forEach(acc => {
                new Swiper(`.mySwiper-${acc.id.replace(/\s+/g, '')}`, {
                    pagination: { el: ".swiper-pagination", clickable: true },
                });
            });
        });

        window.showAccountDetail = (acc) => {
            const content = document.getElementById('detail-content');
            content.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div class="h-[400px] md:h-[500px] rounded-[2rem] overflow-hidden border border-white/10 shadow-2xl">
                        <div class="swiper detailSwiper">
                            <div class="swiper-wrapper">
                                ${acc.images.map(img => `<div class="swiper-slide"><img src="${img.trim()}" class="w-full h-full object-cover"></div>`).join('')}
                            </div>
                            <div class="swiper-button-next"></div>
                            <div class="swiper-button-prev"></div>
                            <div class="swiper-pagination"></div>
                        </div>
                    </div>
                    <div class="flex flex-col justify-center">
                        <h2 class="game-font text-5xl font-black text-white mb-2 italic uppercase">${acc.id}</h2>
                        <div class="text-secondary text-4xl font-black mb-8">${acc.price} Ks</div>
                        <div class="bg-white/5 p-8 rounded-3xl space-y-4 mb-8 border border-white/5">
                            <div class="flex justify-between border-b border-white/5 pb-2"><span>Rank</span><span class="text-white font-bold">${acc.rank}</span></div>
                            <div class="flex justify-between border-b border-white/5 pb-2"><span>Heroes</span><span class="text-white font-bold">${acc.heroes}</span></div>
                            <div class="flex justify-between border-b border-white/5 pb-2"><span>Skins</span><span class="text-white font-bold">${acc.skins}</span></div>
                            <div class="flex justify-between"><span>Login</span><span class="text-green-400 font-bold">${acc.login}</span></div>
                        </div>
                        <a href="https://t.me/Kevindash890" target="_blank" class="btn-gold py-6 text-center rounded-2xl mm-bold uppercase text-xl">ဆက်သွယ်ဝယ်ယူမည်</a>
                    </div>
                </div>
            `;
            switchScreen('screen-detail');
            new Swiper(".detailSwiper", { 
                pagination: { el: ".swiper-pagination", dynamicBullets: true },
                navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" }
            });
        };
    </script>
</body>
</html>
