<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐊𝐞𝐯𝐢𝐧 𝐏𝐫𝐞𝐦𝐢𝐮𝐦 𝐆𝐚𝐦𝐞 𝐒𝐭𝐨𝐫𝐞</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+Myanmar:wght@300;400;700&family=Plus+Jakarta+Sans:wght@300;400;700&display=swap');
        
        :root {
            --primary: #00d2ff;
            --secondary: #ffcc00;
            --bg-dark: #02040a;
            --card-bg: #0b1120;
        }

        body { 
            font-family: 'Noto Sans Myanmar', sans-serif; 
            background-color: var(--bg-dark); 
            color: #e2e8f0; 
            overflow-x: hidden;
        }

        .game-font { font-family: 'Orbitron', sans-serif; }
        .mm-bold { font-weight: 700; }

        /* Screen Transitions */
        .screen { display: none; animation: screenFade 0.5s ease-in-out; min-height: 100vh; }
        .screen.active { display: flex; flex-direction: column; }
        @keyframes screenFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Premium Card */
        .premium-card { 
            background: linear-gradient(145deg, #0f172a 0%, #020617 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s;
        }
        .premium-card:hover { 
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.15);
        }

        /* Gold Button */
        .btn-gold {
            background: linear-gradient(90deg, #b38728 0%, #fbf5b7 50%, #bf953f 100%);
            color: #000;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.3);
        }

        /* Slider Logic */
        .slider-wrapper { display: flex; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); height: 100%; }
        .slide { min-width: 100%; height: 100%; object-fit: cover; }

        .status-badge {
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .available { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; }
        .sold { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div id="screen-welcome" class="screen active items-center justify-center text-center px-6 bg-[url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070')] bg-cover bg-center">
        <div class="bg-black/60 absolute inset-0"></div>
        <div class="relative z-10">
            <h1 class="game-font text-7xl md:text-9xl font-black mb-6 text-white drop-shadow-2xl">𝐊𝐄𝐕𝐈𝐍</h1>
            <p class="max-w-md mx-auto mb-10 text-gray-300 text-lg mm-bold">
                စိတ်ချရသော <span class="text-primary">MLBB အကောင့်များ</span> ကို <br>
                ဒီမှာပဲ ရွေးချယ်ဝယ်ယူလိုက်ပါ
            </p>
            <button onclick="switchScreen('screen-list')" class="btn-gold px-12 py-4 rounded-sm mm-bold uppercase tracking-widest">
                ဆိုင်ထဲသို့ဝင်မည် <i class="fa-solid fa-chevron-right ml-2"></i>
            </button>
        </div>
    </div>

    <div id="screen-list" class="screen bg-[#02040a]">
        <nav class="bg-black/80 backdrop-blur-md border-b border-white/5 flex justify-between items-center p-5 sticky top-0 z-50">
            <button onclick="switchScreen('screen-welcome')" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-house"></i></button>
            <div class="game-font text-2xl font-black">𝐊𝐄𝐕𝐈𝐍 <span class="text-primary italic">STORE</span></div>
            <div class="w-8"></div>
        </nav>

        <div class="container mx-auto px-5 py-10">
            <h2 class="text-2xl font-bold text-white mb-8 mm-bold border-l-4 border-primary pl-4">ရောင်းရန်ရှိသော အကောင့်များ</h2>
            <div id="account-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </div>

    <div id="screen-detail" class="screen bg-[#02040a]">
        <nav class="bg-black/80 backdrop-blur-md border-b border-white/5 flex justify-between items-center p-5 sticky top-0 z-50">
            <button onclick="switchScreen('screen-list')" class="text-gray-400 hover:text-white flex items-center gap-2 font-bold mm-bold">
                <i class="fa-solid fa-arrow-left"></i> နောက်သို့
            </button>
            <span class="game-font text-xs tracking-widest text-primary">DETAILS</span>
            <div class="w-12"></div>
        </nav>
        <div id="detail-content" class="container mx-auto px-5 py-10 max-w-5xl"></div>
    </div>

    <script>
        const accounts = [
            { 
                id: "KV-88210", price: "185,000", rank: "Mythic Glory", heroes: 121, skins: 450, 
                images: [
                    "https://wallpapers.com/images/featured/mobile-legends-pictures-v0h0h39qpg116g3f.jpg",
                    "https://images2.alphacoders.com/105/1059039.jpg",
                    "https://images8.alphacoders.com/105/1059038.jpg"
                ],
                login: "Moonton (အီးမေးလ်ချိန်းရ)", sold: false
            },
            { 
                id: "KV-77341", price: "95,000", rank: "Mythical Honor", heroes: 112, skins: 210, 
                images: [
                    "https://images.alphacoders.com/105/1051515.jpg",
                    "https://images7.alphacoders.com/103/1039751.jpg"
                ],
                login: "Moonton (Clean Security)", sold: true
            }
        ];

        let slideIndex = 0;

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function loadGrid() {
            const grid = document.getElementById('account-grid');
            grid.innerHTML = accounts.map((acc, i) => `
                <div class="premium-card rounded-xl overflow-hidden cursor-pointer" onclick="showDetail(${i})">
                    <div class="relative h-56">
                        <img src="${acc.images[0]}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                        <div class="absolute top-3 left-3">
                            <span class="status-badge ${acc.sold ? 'sold' : 'available'}">${acc.sold ? 'Sold' : acc.rank}</span>
                        </div>
                    </div>
                    <div class="p-5">
                        <div class="flex justify-between items-center mb-4">
                            <span class="game-font text-[10px] text-gray-500">${acc.id}</span>
                            <span class="text-secondary font-black text-lg">${acc.price} Ks</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-[10px] mm-bold">
                            <div class="bg-white/5 p-2 rounded text-center text-primary border border-primary/10">Heroes: ${acc.heroes}</div>
                            <div class="bg-white/5 p-2 rounded text-center text-secondary border border-secondary/10">Skins: ${acc.skins}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showDetail(i) {
            const acc = accounts[i];
            slideIndex = 0;
            const content = document.getElementById('detail-content');
            
            content.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                    <div class="lg:col-span-7">
                        <div class="relative bg-white/5 rounded-2xl overflow-hidden aspect-video group">
                            <div class="slider-wrapper" id="slider-track">
                                ${acc.images.map(img => `<img src="${img}" class="slide">`).join('')}
                            </div>
                            
                            ${acc.images.length > 1 ? `
                            <div class="absolute inset-0 flex justify-between items-center px-4">
                                <button onclick="changeSlide(-1)" class="w-10 h-10 rounded-full bg-black/50 text-white hover:bg-primary transition"><i class="fa-solid fa-chevron-left"></i></button>
                                <button onclick="changeSlide(1)" class="w-10 h-10 rounded-full bg-black/50 text-white hover:bg-primary transition"><i class="fa-solid fa-chevron-right"></i></button>
                            </div>
                            ` : ''}
                        </div>
                        <p class="text-center text-gray-500 text-xs mt-4 mm-bold italic">ပုံများကို တစ်ပုံချင်းစီ ဘေးသို့ဆွဲကြည့်နိုင်သည်</p>
                    </div>

                    <div class="lg:col-span-5 flex flex-col">
                        <div class="mb-6">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="status-badge ${acc.sold ? 'sold' : 'available'} mm-bold">${acc.sold ? 'ရောင်းပြီး' : 'ရောင်းရန်ရှိသည်'}</span>
                            </div>
                            <h2 class="game-font text-5xl font-black text-white mb-2">${acc.id}</h2>
                            <div class="text-secondary text-3xl font-black">${acc.price} <small class="text-sm font-normal text-gray-400">Ks</small></div>
                        </div>

                        <div class="bg-white/5 border border-white/5 p-6 rounded-2xl space-y-5 mb-8">
                            <div class="flex justify-between items-center py-2 border-b border-white/5">
                                <span class="text-gray-400 text-sm mm-bold"><i class="fa-solid fa-user-ninja mr-3 text-primary"></i> Heroes</span>
                                <span class="text-white font-bold">${acc.heroes} Items</span>
                            </div>
                            <div class="flex justify-between items-center py-2 border-b border-white/5">
                                <span class="text-gray-400 text-sm mm-bold"><i class="fa-solid fa-vest mr-3 text-primary"></i> Skins</span>
                                <span class="text-white font-bold">${acc.skins} Items</span>
                            </div>
                            <div class="flex justify-between items-center py-2">
                                <span class="text-gray-400 text-sm mm-bold"><i class="fa-solid fa-lock mr-3 text-primary"></i> Login</span>
                                <span class="text-white font-bold text-sm">${acc.login}</span>
                            </div>
                        </div>

                        <a href="${acc.sold ? '#' : 'https://t.me/Kevindash890'}" target="_blank" 
                           class="${acc.sold ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : 'btn-gold'} py-5 text-center rounded-xl mm-bold text-sm uppercase transition-all shadow-lg">
                            ${acc.sold ? 'SOLD OUT' : 'ဝယ်ယူရန် ဆက်သွယ်မည် <i class="fa-brands fa-telegram ml-2 text-xl"></i>'}
                        </a>
                    </div>
                </div>
            `;
            switchScreen('screen-detail');
        }

        function changeSlide(dir) {
            const track = document.getElementById('slider-track');
            const total = track.children.length;
            slideIndex = (slideIndex + dir + total) % total;
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
        }

        loadGrid();
    </script>
</body>
</html>
